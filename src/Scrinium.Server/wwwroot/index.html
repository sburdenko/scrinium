<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrinium</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <span class="logo">S</span>
      <h1>Scrinium</h1>
      <button id="reset" class="ghost" type="button">New chat</button>
    </header>

    <section id="log" class="log" aria-live="polite">
      <div id="empty" class="empty">
        <h2>Ask your documents</h2>
        <p>Every answer links to the passages it was built from.</p>
      </div>
    </section>

    <form id="form" class="composer">
      <textarea id="question" rows="1" maxlength="2000" placeholder="Ask a question…" aria-label="Question"></textarea>
      <button id="send" class="primary" type="submit">Send</button>
    </form>
  </main>

  <aside id="panel" class="panel" hidden>
    <div class="panel-head">
      <div>
        <div id="panel-title" class="panel-title"></div>
        <div id="panel-page" class="muted"></div>
      </div>
      <button id="panel-close" class="ghost" type="button" aria-label="Close">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <script src="chat.js"></script>
</body>
</html>
